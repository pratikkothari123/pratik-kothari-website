  <marker id="dq-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5 1 9" fill="none" stroke="#537c65" stroke-width="1.5" stroke-linejoin="round"/></marker>
